packages:
  - "packages/*"
  - "mobile"
  - "mobile/kaixa"
  - "mobile/ekipa"

# Expo/React Native tooling expects a flat node_modules layout.
nodeLinker: hoisted

# Keep dependency install scripts deny-by-default and review exact versions.
strictDepBuilds: true
allowBuilds:
  "@firebase/util@1.12.1": true
  "@swc/core@1.11.24": true
  "esbuild@0.25.4": true
  "protobufjs@7.6.5": true
  "re2@1.23.0": true

overrides:
  "ajv@8.20.0>fast-uri": "3.1.4"
  "brace-expansion@1.1.16": "1.1.18"
  "brace-expansion@2.1.2": "2.1.4"
  "brace-expansion@5.0.7": "5.0.9"
  "express@5.2.1>body-parser": "2.3.0"
  "glob@7.2.3>minimatch": "3.1.5"
  "js-yaml@3.15.0": "3.15.1"
  "js-yaml@4.3.0": "4.3.1"
  "nanoid@3.3.16": "3.3.17"
  "postcss@8.4.49": "8.5.26"
  "postcss@8.5.19": "8.5.26"
  "test-exclude@6.0.0>minimatch": "3.1.5"
